<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <!-- Image frame -->
  <rect x="3" y="7" width="22" height="17" rx="2" ry="2" fill="none" stroke="#6b2a2a" stroke-width="1.5"/>
  <!-- Mountain landscape inside frame -->
  <polyline points="3,20 8,13 13,17 17,11 25,20" fill="none" stroke="#6b2a2a" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Sun circle -->
  <circle cx="9" cy="11" r="1.8" fill="none" stroke="#6b2a2a" stroke-width="1.2"/>
  <!-- Plus badge (top-right corner) -->
  <circle cx="28" cy="9" r="5.5" fill="#1c0808" stroke="#6b2a2a" stroke-width="1.3"/>
  <line x1="28" y1="5.5" x2="28" y2="12.5" stroke="#6b2a2a" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="24.5" y1="9" x2="31.5" y2="9" stroke="#6b2a2a" stroke-width="1.8" stroke-linecap="round"/>
</svg>
